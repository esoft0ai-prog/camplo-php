<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # Hosted landing pages: any host other than the app's own (custom domains, {sub}.PAGES_BASE_DOMAIN) is answered
    # by Laravel, so a hosted page's /app.js is never mistaken for Camplo's own files.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^${CAMPLO_APP_HOST}(:[0-9]+)?$ [NC]
    RewriteCond %{HTTP_HOST} !^(localhost|127\.0\.0\.1)(:[0-9]+)?$ [NC]
    RewriteCond %{HTTP_HOST} !\.onrender\.com(:[0-9]+)?$ [NC]
    RewriteCond %{REQUEST_URI} !^/index\.php
    RewriteRule ^ /index.php [PT,L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
