# Render Blueprint — creates the Camplo web service (Laravel, Docker) and its Postgres database.
# Render dashboard → New → Blueprint → pick this repository. Secrets are generated by Render; the only thing it asks
# for is the optional Super Admin login.
#
# Plans: "free" costs nothing, but the web service sleeps after 15 idle minutes and the free database expires after
# 30 days. For real customers switch the service to "starter" and the database to "basic-256mb" (or higher).

services:
  - type: web
    name: camplo-php
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: camplo-php-db
          property: connectionString
      # Generated once by Render. Never change ENCRYPTION_KEY afterwards: stored API keys would become unreadable.
      # To move an existing Camplo (Node) database here, copy that deployment's ENCRYPTION_KEY and JWT_SECRET instead.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AUTO_ACTIVATE
        value: "true"
      - key: ALLOW_DIRECT_PLAN_CHANGE
        value: "true"
      # Seeds the demo workspace on an empty database. Set to "false" before going live with real customers.
      - key: SEED_DEMO
        value: "true"
      # Super Admin console at /admin (optional). Render prompts for these when you create the Blueprint.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false

databases:
  - name: camplo-php-db
    plan: free
    databaseName: camplo
    user: camplo
